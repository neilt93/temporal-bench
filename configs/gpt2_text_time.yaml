model:
  name: gpt2
  use_lora: false
  max_length: 512
  gradient_checkpointing: false

data_dir: data/generated
variant: text_time

batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 0.0005
weight_decay: 0.01
warmup_ratio: 0.06
num_epochs: 10
max_steps: -1

optimizer: adamw_torch
lr_scheduler: cosine
fp16: false
bf16: true

output_dir: outputs
logging_steps: 10
eval_steps: 25
save_steps: 25
save_total_limit: 3
eval_strategy: steps

use_wandb: false
wandb_project: temporal-llm
wandb_run_name: gpt2_text_time

seed: 42
