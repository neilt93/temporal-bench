model:
  name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  use_lora: false
  max_length: 512
  gradient_checkpointing: true

data_dir: data/generated
variant: time_tokens

batch_size: 2
gradient_accumulation_steps: 16
learning_rate: 0.00005
weight_decay: 0.01
warmup_ratio: 0.06
num_epochs: 10
max_steps: -1

optimizer: adamw_bnb_8bit
lr_scheduler: cosine
fp16: false
bf16: true

output_dir: outputs
logging_steps: 10
eval_steps: 25
save_steps: 25
save_total_limit: 3
eval_strategy: steps

use_wandb: false
wandb_project: temporal-llm
wandb_run_name: tinyllama_fullft_time_tokens

seed: 42
