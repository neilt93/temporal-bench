# Quick iteration config using GPT-2 (124M params, fits easily on any GPU)
model:
  name: gpt2
  use_lora: false  # GPT-2 is small enough for full finetune
  max_length: 512

data_dir: data/generated
variant: time_tokens

batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 0.0005
weight_decay: 0.01
warmup_ratio: 0.1
num_epochs: 10
max_steps: -1

optimizer: adamw_torch
lr_scheduler: cosine
fp16: false
bf16: true

output_dir: outputs
logging_steps: 5
eval_steps: 25
save_steps: 25
save_total_limit: 2
eval_strategy: steps

use_wandb: false
wandb_project: temporal-llm

seed: 42
