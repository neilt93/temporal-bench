model:
  name: gpt2
  use_lora: false
  max_length: 512

data_dir: data/v3
variant: text_time

batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 0.0005
weight_decay: 0.01
warmup_ratio: 0.06
num_epochs: 15
max_steps: -1

optimizer: adamw_torch
lr_scheduler: cosine
fp16: true
bf16: false

output_dir: outputs
logging_steps: 10
eval_steps: 50
save_steps: 50
save_total_limit: 5
eval_strategy: steps

use_wandb: false
wandb_project: temporal-llm
wandb_run_name: gpt2_v3_text_time

seed: 42
